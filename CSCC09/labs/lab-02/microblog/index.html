<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Microblog</title>
    <link href="style/main.css" rel="stylesheet" type="text/css" />
    <link href="style/form.css" rel="stylesheet" type="text/css" />
    <link href="style/messages.css" rel="stylesheet" type="text/css"/>
  </head>
  <body>
    <header>
      <a href="/" id="title">Microblog</a>
    </header>

    <form class="complex_form" id="create_message_form">
      <div class="form_title">Post a message</div>
      <input
        type="text"
        class="form_element"
        placeholder="Enter your name"
        name="user_name"
        required
      />
      <textarea
        type="text"
        class="form_element"
        placeholder="Enter your message"
        name="user_message"
        rows="5"
        required
      ></textarea>

      <input
        type="submit"
        class="btn"
        value="Post your message"
      />

    </form>

    <div id="messages">

      <div class="message">
        <div class="pc">
          <img src="uploads/user1.jpg" alt="User Profile Picture" class="profile-pic">
          <strong class="user-name">Alice</strong>
        </div>
        
        <div class="msg-contant">
          <div class="msg">This microblog is way better than Piazza!</div>
          <div class="actions">
            <div class="thumb-up">0</div>
            <div class="thumb-down">0</div>
            <div class="cross"></div>
          </div>
        </div>
      </div>


      <div class="message">
        <div class="pc">
          <img src="uploads/user2.jpg" alt="User Profile Picture" class="profile-pic">
          <strong class="user-name">Bob</strong>
        </div>
        
        <div class="msg-contant">
          <div class="msg">Welcome to CSCC09!</div>
          <div class="actions">
            <div class="thumb-up">0</div>
            <div class="thumb-down">0</div>
            <div class="cross"></div>
          </div>
        </div>
      </div>

    </div>

    <footer>
      <a href="./credits.html">credits</a>
    </footer>
  </body>
</html>
